# Telegraf Configuration for KNX-MQTT Bridge

[agent]
  interval = "5s"
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_jitter = "0s"
  precision = "1s"
  hostname = ""
  omit_hostname = false

# Subscribe to KNX GroupAddresses notification topics
[[inputs.mqtt_consumer]]
  ## MQTT broker URLs
  servers = ["tcp://mosquitto:1883"]

  ## Topics to subscribe to - only notification messages from GroupAddresses
  topics = [
    "knx/GroupAddresses/+/+/+/notification",  # Three-level addresses
    "knx/GroupAddresses/+/+/notification"     # Two-level addresses
  ]

  ## QoS policy for messages
  qos = 0

  ## Connection timeout
  connection_timeout = "30s"

  ## Data format
  data_format = "json"

  ## JSON configuration
  json_string_fields = ["RawValue"]  # Keep RawValue as string
  json_time_key = "Timestamp"
  json_time_format = "2006-01-02T15:04:05Z07:00"

  ## Use metadata fields as tags for efficient querying
  tag_keys = [
    "Address",
    "Metadata_Name",
    "Metadata_DataPointType",
    "Metadata_Category",
    "Metadata_Subcategory",
    "Metadata_ClassicDataType"
  ]

  ## Rename measurement
  name_override = "knx"

  ## Only pass Value and RawValue fields to InfluxDB
  fieldpass = ["Value", "RawValue"]

# Convert boolean Value fields to floats using Starlark
# This handles the case where JSON boolean true/false needs to become 1.0/0.0
[[processors.starlark]]
  namepass = ["knx"]
  source = '''
def apply(metric):
    # Check if Value field exists and is a boolean
    if "Value" in metric.fields:
        value = metric.fields["Value"]
        # Convert boolean to float: true -> 1.0, false -> 0.0
        if value == True:
            metric.fields["Value"] = 1.0
        elif value == False:
            metric.fields["Value"] = 0.0
    return metric
'''

# Convert all Value fields to floats for InfluxDB compatibility
# InfluxDB requires consistent field types - since temperatures use float,
# we convert any remaining non-float values to floats
[[processors.converter]]
  namepass = ["knx"]
  [processors.converter.fields]
    float = ["Value"]

# Output to InfluxDB v2
[[outputs.influxdb_v2]]
  ## InfluxDB URL
  urls = ["http://influxdb:8086"]

  ## Authentication token
  token = "my-super-secret-token"

  ## Organization
  organization = "knx"

  ## Destination bucket
  bucket = "knx-data"

  ## Timeout for HTTP messages
  timeout = "5s"

  ## HTTP User-Agent
  user_agent = "telegraf-knx"

# Debug output (optional - comment out in production)
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"