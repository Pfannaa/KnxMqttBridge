# Mosquitto configuration - No security, wide open for development

# Standard MQTT listener
listener 1883 0.0.0.0

# WebSocket listener for browser clients (React dashboard)
listener 9001
protocol websockets

# Allow anonymous connections
allow_anonymous true

# No authentication required
# password_file (commented out)

# No access control
# acl_file (commented out)

# Persistence settings (optional but useful)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all

# Connection messages
connection_messages true