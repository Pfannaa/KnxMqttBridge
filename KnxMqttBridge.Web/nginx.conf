server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the XML file (mounted as a volume)
    location /GroupAddresses.xml {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
